reliefweb_user_posts.content:
  path: '/user/{user}/posts'
  defaults:
    _controller: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::getOverview'
    _title_callback: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::getTitle'
  options:
    parameters:
      user:
        type: entity:user
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::checkUserPostsPageAccess'
    user: \d+

reliefweb_user_posts.content.bundle:
  path: '/user/{user}/posts/{bundle}'
  defaults:
    _controller: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::getContent'
    _title_callback: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::getTitle'
  options:
    parameters:
      user:
        type: entity:user
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::checkUserPostsPageAccess'
    user: \d+
    bundle: 'report|job|training'

reliefweb_user_posts.content.current_user:
  path: '/user/posts'
  defaults:
    _controller: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::currentUserPostsPage'
    _title: 'My posts'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::checkCurrentUserPostsPageAccess'

reliefweb_user_posts.content.current_user.bundle:
  path: '/user/posts/{bundle}'
  defaults:
    _controller: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::currentUserPostsBundlePage'
    _title: 'My posts'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::checkCurrentUserPostsPageAccess'
    bundle: 'report|job|training'

reliefweb_user_posts.autocomplete:
  path: '/user/{user}/posts/{bundle}/autocomplete/{filter}'
  defaults:
    _controller: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::autocompleteFilter'
  options:
    parameters:
      user:
        type: entity:user
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: '\Drupal\reliefweb_user_posts\Controller\UserPostsPage::checkUserPostsPageAccess'
    user: \d+
    bundle: 'report|job|training'
    filter: "[a-z0-9_]+"
