reliefweb_ai.settings:
  type: config_object
  label: 'ReliefWeb AI settings.'
  mapping:
    language_detection:
      type: mapping
      label: 'Settings for the language detection.'
      mapping:
        min_chars:
          type: integer
          label: 'Minimum characters required before language detection.'
        min_line_chars:
          type: integer
          label: 'Minimum characters for a line to keep when building detection samples.'
        max_pages:
          type: integer
          label: 'Maximum number of attachment pages to extract for language detection.'
        reliable_ratio:
          type: float
          label: 'Strict ELD isReliable average-score ratio (lower is less strict).'
        reliable_ratio_soft:
          type: float
          label: 'Soft ELD isReliable average-score ratio used when no stage passes the strict ratio.'
        title_min_chars:
          type: integer
          label: 'Minimum characters for the title stage on strict, soft, and score passes (title-lenient ignores this).'
        score_margin_min:
          type: float
          label: 'Minimum (top - second) / top score margin for the cross-stage score tie-break.'
        eld_database:
          type: string
          label: 'Eld ngram database size (small, medium, large, or extralarge).'
