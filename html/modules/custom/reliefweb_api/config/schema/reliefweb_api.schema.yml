reliefweb_api.settings:
  type: config_object
  label: 'Reliefweb API settings'
  mapping:
    api_url:
      type: string
      label: 'ReliefWeb API URL'
    api_url_external:
      type: string
      label: 'ReliefWeb API URL external, for autocomplete calls from the frontend (JS).'
    post_api_schema_url:
      type: string
      label: 'Base URL of the POST API schemas.'
    appname:
      type: string
      label: 'App name parameter to indentify the API requests.'
    cache_enabled:
      type: boolean
      label: 'Cache the query results.'
    cache_lifetime:
      type: integer
      label: 'Cache duration (in seconds) for the query results.'
    cache_namespace:
      type: string
      label: 'Namespace for the API caching.'
    verify_ssl:
      type: boolean
      label: 'Verify the SSL certificate of the API query performing requests.'
    elasticsearch:
      type: string
      label: 'URL of the elasticsearch instance for indexing.'
    elasticsearch_auth_type:
      type: string
      label: 'Elasticsearch authentication type (none, basic or apikey).'
    elasticsearch_username:
      type: string
      label: 'Elasticsearch basic authentication username.'
    elasticsearch_password:
      type: string
      label: 'Elasticsearch basic authentication password.'
    elasticsearch_api_key:
      type: string
      label: 'Elasticsearch API key authentication credentials.'
    elasticsearch_verify_tls:
      type: boolean
      label: 'Verify TLS certificates when connecting to Elasticsearch.'
    elasticsearch_ca_file:
      type: string
      label: 'Path to a custom CA certificate file for Elasticsearch TLS verification.'
    base_index_name:
      type: string
      label: 'Base index name in elasticsearch.'
    website:
      type: string
      label: 'Scheme and host to use as base for the URLs in the indexed content.'
    replicas:
      type: integer
      label: 'Number of elasticsearch index replicas'
    shards:
      type: integer
      label: 'Number of elasticsearch index shards'
    log:
      type: string
      label: 'Log option for the API indexing.'
