services:
  cache.reliefweb_api:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: cache_factory:get
    arguments: [reliefweb_api]
  reliefweb_api.client:
    class: Drupal\reliefweb_api\Services\ReliefWebApiClient
    arguments: ['@cache.reliefweb_api', '@config.factory', '@datetime.time', '@http_client', '@logger.factory', '@request_stack']
  reliefweb_api.elasticsearch:
    class: Drupal\reliefweb_api\Services\ReliefWebElasticsearchClient
    arguments: ['@http_client', '@config.factory', '@database']
  reliefweb_api.failure_cache_subscriber:
    class: Drupal\reliefweb_api\EventSubscriber\ReliefWebApiFailureCacheSubscriber
    arguments: ['@datetime.time', '@config.factory']
    tags:
      - { name: event_subscriber }
