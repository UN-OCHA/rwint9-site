## Limit Post API JSON body size (attachments are URLs, not uploads).
location ^~ /api/v2/ {
  client_max_body_size 2m;
  error_page 413 = @post_api_413;
  try_files /dev/null @drupal;
}

## JSON 413 for Post API (do not use the CMS HTML @drupal-error-413 handler).
location @post_api_413 {
  default_type application/json;
  return 413 '"Request body too large."';
}
