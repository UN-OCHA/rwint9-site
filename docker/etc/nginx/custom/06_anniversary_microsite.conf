## RW 30th Anniversary microsite proxy.
## https://ocha-dap.github.io/reliefweb-at-30
location ^~ /reliefweb-at-30/ {
  ## Remove cookies.
  more_clear_input_headers Cookie;

  ## Ensure the proxy host is in a variable, so nginx will not cache the IP
  ## indefinitely and cause 502 errors if the IPs change.
  set $microsite_host "ocha-dap.github.io";

  ## Proxy the request to the GitHub microsite.
  proxy_ssl_server_name on;
  proxy_set_header Host $microsite_host;
  proxy_pass https://$microsite_host$request_uri;
  proxy_http_version 1.1;
  proxy_redirect off;
  proxy_intercept_errors on;

  ## Add an header to be check if we hit the cache.
  add_header X-Nginx-Cache $upstream_cache_status;
}
