## ReliefWeb API suggest proxy.
## Hides the appname (and other fixed suggest params) from browser autocomplete
## calls.
location ~ "^/api-suggest/(?<rw_resource>countries|sources|disasters)/?$" {
  if ($request_method != GET) {
    return 405;
  }

  ## Retrieve the API base URL and appname from the environment.
  set_by_lua $rw_api_url 'return os.getenv("RELIEFWEB_API_URL") or ""';
  set_by_lua $rw_appname 'return os.getenv("RELIEFWEB_API_APPNAME") or ""';
  if ($rw_api_url = "") {
    return 404;
  }
  if ($rw_appname = "") {
    return 404;
  }

  ## Ensure the proxy host is in a variable, so nginx will not cache the IP
  ## indefinitely and cause 502 errors if the IPs change.
  set $rw_api_host "";

  ## Build the upstream URL, injecting fixed suggest parameters.
  set_by_lua_block $rw_suggest_proxy_url {
    local api_url = ngx.var.rw_api_url:gsub("/+$", "")
    local scheme, host, base_path = api_url:match("^(https?)://([^/]+)(.*)$")
    if scheme == nil or host == nil then
      return ""
    end
    base_path = base_path or ""

    -- Expose host for the Host header.
    ngx.var.rw_api_host = host

    local args = ngx.req.get_uri_args()
    -- Override client-supplied values for parameters we own.
    -- Pass through query, filter, sort, and other client params.
    args["appname"] = ngx.var.rw_appname
    args["preset"] = "suggest"
    args["profile"] = "suggest"
    args["slim"] = 1

    local query = ngx.encode_args(args)
    return scheme .. "://" .. host .. base_path .. "/" .. ngx.var.rw_resource .. "?" .. query
  }

  if ($rw_suggest_proxy_url = "") {
    return 404;
  }

  ## Remove cookies.
  more_clear_input_headers Cookie;

  ## Proxy the request to the ReliefWeb API.
  proxy_ssl_server_name on;
  proxy_set_header Host $rw_api_host;
  proxy_pass $rw_suggest_proxy_url;
  proxy_http_version 1.1;
  proxy_redirect off;
  proxy_intercept_errors on;
}
