uuid: 536c1c66-3e78-40b0-af46-d3d83d970146
langcode: en
status: true
dependencies: {  }
id: node_report
label: Reports
limit: 3
validation:
  empty: false
target:
  entity_type_id: node
  bundle: report
fields:
  analyzable:
    body:
      enabled: true
    field_file:
      enabled: true
  classifiable:
    field_content_format:
      enabled: true
      min: 1
      max: 1
      hide: false
      force: false
    field_country:
      enabled: true
      min: 1
      max: -1
      hide: false
      force: false
    field_primary_country:
      enabled: true
      min: 1
      max: 1
      hide: false
      force: false
  fillable:
    title:
      enabled: true
      properties:
        - value
      hide: false
      force: false
classifier:
  id: structured_inference
  settings:
    analyzable:
      fields:
        body:
          placeholder: source_content
          processor: reliefweb_body
          file: true
        field_file:
          placeholder: source_document
          processor: reliefweb_attachment
          file: true
    classifiable:
      vocabularies:
        content_format:
          description: 'ReliefWeb report content formats. Select the single most specific match.'
          value: custom
          term_title_source: none
          term_description_source: none
          terms:
            3:
              include: '1'
              value: Analysis
              title: ''
              description: 'Detailed, multi-page reports providing in-depth insights, policy discussions, or actionable recommendations. Typically cover extended periods (e.g., 6 months, 1 year) and focus on strategic understanding rather than immediate updates.'
            4:
              include: '1'
              value: Appeal
              title: ''
              description: 'Financial appeals targeting donors, such as Strategic Response Plans or Flash Appeals, outlining funding needs for specific crises.'
            5:
              include: '1'
              value: Assessment
              title: ''
              description: 'Field-based evaluations of needs or conditions (e.g., food security analyses, mission reports), often focused on a specific area or population over a defined period.'
            6:
              include: '1'
              value: 'Evaluation and Lessons Learned'
              title: ''
              description: 'Reviews of program performance, identifying best practices and providing recommendations for improvement. May include analysis of outcomes over a specific timeframe.'
            12570:
              include: '1'
              value: Infographic
              title: ''
              description: 'Documents primarily presenting data through visual elements such as charts, graphs, tables, and statistics, often including supporting maps. These documents focus on communicating data and statistics visually with minimal accompanying explanatory text. May contain multiple types of visualizations in a single document, including maps as supporting elements.'
            38974:
              value: Interactive
              title: ''
              description: ''
              include: 0
            7:
              include: '1'
              value: 'Manual and Guideline'
              title: ''
              description: 'Practical toolkits, handbooks, or reference materials intended for guidance (e.g., standards, glossaries).'
            12:
              include: '1'
              value: Map
              title: ''
              description: 'Primarily geographic representations with minimal text, focusing on spatial relationships.'
            8:
              include: '1'
              value: 'News and Press Release'
              title: ''
              description: 'Short, time-sensitive announcements or updates for media or public audiences. Often includes organizational opinions or activity highlights.'
            9:
              include: '1'
              value: Other
              title: ''
              description: 'Content that does not fit other categories (e.g., technical agreements, raw data tables).'
            10:
              include: '1'
              value: 'Situation Report'
              title: ''
              description: 'Time-bound operational updates (daily, weekly, monthly) summarizing emergency response efforts and progress by sectors/clusters. May include some data visualizations but focuses on narrative updates.'
            11:
              include: '1'
              value: 'UN Document'
              title: ''
              description: 'Official UN resolutions (e.g., Security Council/General Assembly), Secretary-General reports, or documents with UN symbols (e.g., A/..., S/..., E/..., A/RES/..., S/RES/..., S/PRST/..., A/HRC/..., ST/SGB/...).'
        country:
          description: ''
          value: name
          term_title_source: none
          term_description_source: none
      fields:
        field_content_format:
          placeholder: document_type
          description: 'Select the single format that best matches the document''s primary purpose and presentation. Always check whether a narrower, more specific format applies before selecting Analysis. Select UN Document whenever an official UN symbol (e.g., A/RES/, S/RES/, ST/SGB/) appears in the title, header, or footer. Do not select Infographic or Map just because a text report includes supporting charts, tables, or maps; reserve Infographic for documents where visual data and statistics are the main content, and Map for documents that are primarily a standalone map. Use Other only when no other format fits.'
        field_country:
          placeholder: countries
          description: 'Prominently featured countries. For any named refugee or displaced population, also include their widely recognized, primary country of origin — even if not explicitly mentioned in the document. Limit this inference to one direct level: only the origin country of the named group, not transit countries, donor countries, or geopolitically related nations. Use World for global content.'
        field_primary_country:
          placeholder: primary_country
          description: 'Primary focus country from the selected list of countries. In case of tie, select the first mentioned country, prioritizing the title of the document.'
    fillable:
      fields:
        title__value:
          placeholder: title
          description: 'Exact title of the document.'
    inference:
      plugin_id: aws_bedrock_nova_lite_v1
      temperature: 0.0
      top_p: 0.9
      max_tokens: 4000
      thinking_mode: none
      system_prompt: ''
      prompt: 'Classify the humanitarian document using the `structured_output` tool.'
